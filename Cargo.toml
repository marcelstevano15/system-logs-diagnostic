[package]
name = "system-logs-diagnostic"
version = "3.0.0"
edition = "2021"
authors = ["Marcel Stevano <marcelstevano15@gmail.com>"]
license = "GPL-3.0-or-later"
description = "Enterprise-grade GNOME system log viewer and diagnostic tool"
repository = "https://github.com/marcelstevano15/system-logs-diagnostic"

[dependencies]
adw = { package = "libadwaita", version = "0.7.2", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.9.7", features = ["v4_12"] }
glib = "0.20.9"
gio = "0.20.9"
gdk4 = { package = "gdk4", version = "0.9.6" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.102"
thiserror = "1"

async-channel = "2.3"
tokio = { version = "1", features = ["full"] }
crossbeam = "0.8"

regex = "1"
memchr = "2"
tantivy = "0.22"

parking_lot = "0.12"
once_cell = "1.21.4"
arc-swap = "1"
indexmap = "2"
smallvec = { version = "1", features = ["serde"] }
dirs-next = "2.0"

rayon = "1"
flate2 = "1"
tar = "0.4"

notify = "6"
ignore = "0.4"

strum = "0.28.0"
strum_macros = "0.28.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

systemd-journal-reader = "0.1.1"
loglens-core = "0.1.3"

