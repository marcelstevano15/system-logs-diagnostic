[package]
name = "system-logs-diagnostic"
version = "1.0.0"
edition = "2021"
authors = ["Marcel Stevano"]
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }

glib = "0.20"
gio = "0.20"

regex = "1"
serde = "1.0.228"
serde_json = "1.0"
chrono = "0.4"
once_cell = "1.21.4"
strum = "0.28.0"
anyhow = "1.0.102"
systemd-journal-reader = "0.1.1"
loglens-core = "0.1.3"
